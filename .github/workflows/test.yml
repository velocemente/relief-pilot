name: Test

# Runs on every pull request. No build step exists for the app, so this checks:
#   1. the inline scripts of index.html (and sw.js) parse
#   2. unit tests (test/unit)
#   3. the extractor still reproduces the fixtures' text byte-for-byte
#   4. golden compare: _ofpRulesetParse on every fixture package vs. its snapshot
# The fixtures live in the PRIVATE repo velocemente/pilotbrief-fixtures and are
# read with the read-only secret FIXTURES_TOKEN (see that repo's README).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PilotBrief
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (pdfjs-dist 3.11.174, pinned)
        run: npm ci

      - name: Build dist/index.html from src/ modules
        run: node build/build.js

      - name: Verify build output matches committed index.html
        run: |
          expected=$(sha256sum index.html | awk '{print $1}')
          actual=$(sha256sum dist/index.html | awk '{print $1}')
          if [ "$expected" != "$actual" ]; then
            echo "Hash mismatch: index.html=$expected dist/index.html=$actual"
            exit 1
          fi
          echo "Hash match: $expected"

      - name: Syntax check inline scripts
        run: node test/check-syntax.js

      # Use the fixtures branch with the SAME name as this PR's branch if it
      # exists, otherwise main. Only "branch does not exist" may fall back to
      # main: any error in the lookup itself (auth, network, repo not found)
      # fails the job. The token is passed through env and a git config
      # environment variable; it never appears in a command line or the log.
      - name: Check for matching fixtures branch
        id: fixtures_branch
        if: github.event.pull_request.head.repo.fork != true
        env:
          FIXTURES_TOKEN: ${{ secrets.FIXTURES_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          if [ -z "$FIXTURES_TOKEN" ]; then
            echo "::error::FIXTURES_TOKEN is empty or not available; cannot look up the fixtures branch."
            exit 1
          fi
          auth=$(printf 'x-access-token:%s' "$FIXTURES_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          # A failing ls-remote (exit != 0) aborts here via set -e; the message
          # below makes the cause obvious.
          if ! heads=$(git ls-remote --heads \
            https://github.com/velocemente/pilotbrief-fixtures.git 2>ls-remote.err); then
            echo "::error::Fixtures branch lookup FAILED (auth or network), not falling back to main: $(sed 's/^/  /' ls-remote.err | tr '\n' ' ')"
            exit 1
          fi
          rm -f ls-remote.err
          if printf '%s\n' "$heads" | awk '{print $2}' | grep -Fxq "refs/heads/$BRANCH"; then
            ref="$BRANCH"
          else
            ref="main"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Fixtures ref used: $ref (app branch: $BRANCH)"

      # Secrets are not passed to pull requests from forks, so the fixtures
      # cannot be read there. Such a PR must be re-run by a maintainer from a
      # branch in this repository before it can be approved.
      - name: Checkout fixtures (private)
        id: fixtures
        if: github.event.pull_request.head.repo.fork != true
        uses: actions/checkout@v4
        with:
          repository: velocemente/pilotbrief-fixtures
          token: ${{ secrets.FIXTURES_TOKEN }}
          path: fixtures
          ref: ${{ steps.fixtures_branch.outputs.ref }}
          persist-credentials: false

      - name: Fixtures not available (fork pull request)
        if: github.event.pull_request.head.repo.fork == true
        run: |
          echo "::warning::Golden compare skipped: fork pull requests cannot read the private fixtures repo. Do not approve until it has run from a branch in this repository."
          exit 1

      - name: Unit tests
        if: github.event.pull_request.head.repo.fork != true
        env:
          PB_FIXTURES: fixtures
        run: npm test

      - name: Extractor reproduces fixtures text/ and items/
        run: node tools/extract/verify.js fixtures

      - name: Golden compare
        run: node test/golden/run.js compare --fixtures fixtures
